<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCE Xmas Quest Firebase v0.8</title><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#17212b}.app{max-width:480px;margin:auto}.hidden{display:none!important}header{background:#17212b;color:white;padding:18px}.card{background:white;margin:14px;padding:18px;border-radius:16px}.tile,.question{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;align-items:center}.new{background:#eef4ff;color:#175cd3;border-radius:20px;padding:5px 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;padding:10px;border-radius:10px}.stat b{display:block;font-size:20px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#fc0;font-weight:bold}.green{background:#14804a;color:white}.red{background:#c62828;color:white}.back{width:auto;background:transparent}.barbg{height:8px;background:#ddd}.bar{height:8px;background:#fc0}.question.correct{border:2px solid #6ce9a6}.question.closed{border:2px solid #fda29b}input{width:100%;padding:12px;margin:8px 0}.msg{padding:10px;margin-top:8px}.ok{background:#ecfdf3;color:#14804a}.err{background:#fef3f2;color:#c62828}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center}.modal>div{background:white;padding:20px;border-radius:14px;width:min(400px,90%)}.rank{display:flex;justify-content:space-between;padding:10px}</style></head><body><div class="app"><header><h1>🏆 VCE XMAS QUEST</h1><small>Firebase Sprint 2 · v0.8</small></header><div id="loading" class="card">Connessione a Firebase...</div><div id="fatal" class="card err hidden"></div><section id="home" class="hidden"><div class="card"><h2 id="team"></h2><small id="conn">Connessione in corso</small><div id="tiles"></div><div class="stats"><div class="stat"><b id="av">0</b>Disponibili</div><div class="stat"><b id="pe">0</b>Da completare</div><div class="stat"><b id="co">0</b>Completate</div></div><p><b id="overall">0 / 4 domande completate</b></p></div><div class="card"><h2><span id="score">0</span> punti</h2><button id="rankBtn">CLASSIFICA</button></div></section><section id="mission" class="hidden"><div class="card"><button id="back" class="back">← Home</button><div class="row"><h2 id="mName"></h2><span id="mNew" class="new">NEW</span></div><h3 id="mTitle"></h3><div class="barbg"><div id="bar" class="bar"></div></div><p id="mProgress"></p><div id="questions"></div><div id="mEnd" class="hidden"><h2 id="endTitle"></h2><button id="return">TORNA ALLA HOME</button></div></div></section></div><div id="ranking" class="modal hidden"><div><h2>🏅 Classifica</h2><div id="rankRows"></div><button id="close">CHIUDI</button></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';import{getDatabase,ref,onValue,get,runTransaction}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js';
const cfg={apiKey:'AIzaSyDZ2lOLfL-zW23r3Tnvt-3XyBudAfnlml4',authDomain:'vce-xmas-quest.firebaseapp.com',databaseURL:'https://vce-xmas-quest-default-rtdb.europe-west1.firebasedatabase.app',projectId:'vce-xmas-quest',storageBucket:'vce-xmas-quest.firebasestorage.app',messagingSenderId:'459157919089',appId:'1:459157919089:web:5718b06601c54ebf7d92d0'},$=x=>document.getElementById(x),teams={alpha:'Team Alpha',bravo:'Team Bravo',charlie:'Team Charlie'},tk=(new URLSearchParams(location.search).get('team')||'').toLowerCase(),mids=['mission1','mission2'],defs={mission1:[{id:'q1',text:'Trova una persona che ha lavorato in almeno 2 sedi Volvo CE.',hint:'Inserisci Nome e Cognome.',points:20,answers:['mario rossi','rossi mario']},{id:'q2',text:"Trova il nome dell'applicazione utilizzata per il monitoraggio remoto delle macchine Volvo CE.",hint:"Inserisci il nome dell'applicazione.",points:15,answers:['caretrack','care track']}],mission2:[{id:'q1',text:'In quale paese ha origine Volvo?',hint:'Inserisci il nome del paese.',points:20,answers:['svezia','sweden']},{id:'q2',text:'Quale città svedese è storicamente associata alla nascita di Volvo?',hint:'Inserisci il nome della città.',points:15,answers:['goteborg','gothenburg']}]};
let db,active='mission1',td={score:0},md={mission1:{title:'Scopri persone e strumenti Volvo CE'},mission2:{title:'Conosci Volvo'}},ans={mission1:{},mission2:{}},msgs={};const norm=v=>v.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' '),st=(m,q)=>ans[m]?.[q]||{status:'new',tries:0},res=m=>defs[m].filter(q=>['correct','closed'].includes(st(m,q.id).status)).length,start=m=>defs[m].some(q=>st(m,q.id).status!=='new'||+st(m,q.id).tries>0),perfect=m=>defs[m].every(q=>st(m,q.id).status==='correct');
function refresh(){$('team').textContent=td.name||teams[tk];$('score').textContent=+td.score||0;let a=0,p=0,c=0,t=0;$('tiles').innerHTML='';mids.forEach((m,i)=>{let r=res(m),done=r===2,begun=start(m);t+=r;done?c++:begun?p++:a++;let d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="row"><h2>Missione ${i+1}</h2><span class="new ${begun?'hidden':''}">NEW</span></div><h3>${md[m]?.title||'Missione '+(i+1)}</h3><p>${r} / 2 domande completate</p><button class="${done?(perfect(m)?'green':'red'):''}">${done?'COMPLETATA':begun?'DA COMPLETARE':'INIZIA MISSIONE'}</button>`;d.querySelector('button').onclick=()=>openM(m);$('tiles').appendChild(d)});$('av').textContent=a;$('pe').textContent=p;$('co').textContent=c;$('overall').textContent=`${t} / 4 domande completate`}
function openM(m){active=m;$('home').classList.add('hidden');$('mission').classList.remove('hidden');render()}
function render(){let r=res(active),done=r===2;$('mName').textContent='Missione '+(mids.indexOf(active)+1);$('mTitle').textContent=md[active]?.title||active;$('mProgress').textContent=`${r} di 2 domande completate`;$('bar').style.width=r*50+'%';$('mNew').classList.toggle('hidden',start(active));$('questions').innerHTML='';defs[active].forEach((q,i)=>{let s=st(active,q.id),rem=Math.max(0,3-(+s.tries||0)),d=document.createElement('div');d.className='question '+(s.status==='correct'?'correct':s.status==='closed'?'closed':'');let h=`<h3>Domanda ${i+1}</h3><p>${q.text}</p><p>Punti: <b>${q.points}</b> · Tentativi: <b>${rem}</b></p>`;if(s.status==='correct')h+='<div class="msg ok">✅ Risposta corretta</div>';else if(s.status==='closed')h+='<div class="msg err">⛔ Domanda chiusa. Penalità: -5 punti.</div>';else h+=`<input id="a-${q.id}" placeholder="Risposta"><small>${q.hint}</small><button>INVIA RISPOSTA</button>${msgs[active+q.id]?`<div class="msg err">${msgs[active+q.id]}</div>`:''}`;d.innerHTML=h;d.querySelector('button')?.addEventListener('click',()=>submit(q));$('questions').appendChild(d)});$('mEnd').classList.toggle('hidden',!done);if(done)$('endTitle').textContent=perfect(active)?'✅ Missione completata':'⛔ Missione completata con penalità';refresh()}
async function submit(q){let v=norm($('a-'+q.id).value),k=active+q.id;if(!v){msgs[k]='⚠️ Inserisci una risposta.';render();return}msgs[k]='';let delta=0,x=await runTransaction(ref(db,`answers/${tk}/${active}/${q.id}`),cur=>{let s=cur||{status:'new',tries:0};if(['correct','closed'].includes(s.status))return;let used=+s.tries||0;if(q.answers.includes(v)){delta=q.points;return{status:'correct',tries:used+1}}let n=used+1;if(n>=3){delta=-5;return{status:'closed',tries:3}}return{status:'new',tries:n}});if(x.committed&&delta)await runTransaction(ref(db,`teams/${tk}/score`),v=>(+v||0)+delta)}
async function showRank(){let d=(await get(ref(db,'teams'))).val()||{},r=Object.keys(d).map(k=>({name:d[k].name||teams[k]||k,score:+d[k].score||0})).sort((a,b)=>b.score-a.score);$('rankRows').innerHTML=r.map((x,i)=>`<div class="rank"><b>${i+1}° ${x.name}</b><b>${x.score} punti</b></div>`).join('');$('ranking').classList.remove('hidden')}
try{if(!teams[tk])throw Error('QR Code non valido: usa ?team=alpha, ?team=bravo oppure ?team=charlie.');db=getDatabase(initializeApp(cfg));onValue(ref(db,'.info/connected'),s=>$('conn').textContent=s.val()?'● Firebase connesso':'● Connessione assente');onValue(ref(db,`teams/${tk}`),s=>{td=s.val()||td;$('loading').classList.add('hidden');$('home').classList.remove('hidden');refresh()});mids.forEach(m=>{onValue(ref(db,`missions/${m}`),s=>{md[m]=s.val()||md[m];refresh();if(active===m&&!$('mission').classList.contains('hidden'))render()});onValue(ref(db,`answers/${tk}/${m}`),s=>{ans[m]=s.val()||{};refresh();if(active===m&&!$('mission').classList.contains('hidden'))render()})});$('back').onclick=$('return').onclick=()=>{$('mission').classList.add('hidden');$('home').classList.remove('hidden');refresh()};$('rankBtn').onclick=showRank;$('close').onclick=()=>$('ranking').classList.add('hidden')}catch(e){$('loading').classList.add('hidden');$('fatal').textContent=e.message;$('fatal').classList.remove('hidden')}
</script></body></html>
