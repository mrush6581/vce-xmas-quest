<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCE Xmas Quest Multi-Team v0.6</title>
<style>:root{--y:#ffcc00;--ink:#17212b;--muted:#667085;--bg:#f4f6f8;--green:#14804a;--red:#c62828;--line:#e5e7eb;--blue:#175cd3;--warnbg:#fff4ed}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:auto;min-height:100vh}.hidden{display:none!important}header{background:var(--ink);color:#fff;padding:18px 20px;display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;background:var(--y);border-radius:10px;display:grid;place-items:center;font-size:22px}header h1{font-size:18px;margin:0}header p{font-size:12px;margin:3px 0 0;color:#d0d5dd}main{padding:18px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 14px #10182814;margin-bottom:14px}.team{font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hero{font-size:28px;font-weight:800;margin:8px 0}.mission-list{display:grid;gap:12px;margin-top:14px}.mission-tile{border:1px solid var(--line);border-radius:14px;padding:13px;background:#f8fafc}.mission-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mission-name{font-size:21px;font-weight:800}.new{background:#eef4ff;color:var(--blue);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.mission-subtitle{margin:6px 0 10px;font-size:18px;font-weight:600;line-height:1.3}.tile-progress{display:block;font-size:12px;font-weight:700;margin-bottom:10px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.yellow{background:var(--y)}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.stat,.progress-stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.progress-stat b{display:block;font-size:18px;margin-top:4px}.back{width:auto;background:transparent;padding:4px 0;margin-bottom:12px}.mission-title{font-size:20px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--y);width:0}.small{font-size:12px;color:var(--muted);margin:7px 0 12px}.question{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.meta{display:flex;gap:7px;margin:10px 0}.chip{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}.chip strong{color:var(--ink)}.chip.last{background:var(--warnbg);border-color:#fda29b;color:var(--red)}input{width:100%;padding:13px;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;margin:8px 0 7px}.msg{padding:10px;border-radius:10px;margin-top:10px;font-weight:700;font-size:14px}.ok{background:#ecfdf3;color:var(--green)}.err{background:#fef3f2;color:var(--red)}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modal-card{background:#fff;border-radius:16px;padding:20px;width:min(420px,100%)}.rank{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.error{background:#fef3f2;color:var(--red);border:1px solid #fda29b;border-radius:12px;padding:16px}@media(max-width:390px){.stats{grid-template-columns:1fr}}</style></head>
<body><div class="app"><header><div class="logo">🏆</div><div><h1>VCE XMAS QUEST</h1><p>Multi-Team v0.6</p></div></header><main><div id="error" class="error hidden"></div>
<section id="home"><div class="card"><div id="teamName" class="team"></div><div id="list" class="mission-list"></div><div class="stats"><div class="stat"><b id="available">0</b><span>Missioni disponibili</span></div><div class="stat"><b id="pending">0</b><span>Missioni da completare</span></div><div class="stat"><b id="completed">0</b><span>Missioni completate</span></div></div><div class="progress-stat"><span class="label">Progresso complessivo</span><b id="overall">0 / 4 domande completate</b></div></div><div class="card"><div class="label">Punteggio</div><div class="hero"><span id="score">0</span> punti</div><button id="rankingBtn" class="yellow">CLASSIFICA</button></div></section>
<section id="mission" class="hidden"><button id="back" class="back">← Home</button><div class="card"><div class="mission-row"><span id="missionName" class="mission-name"></span><span id="missionNew" class="new hidden">NEW</span></div><h2 id="missionTitle" class="mission-title"></h2><div class="progress"><div id="bar" class="bar"></div></div><div id="missionProgress" class="small"></div><div id="questions"></div><div id="missionEnd" class="card hidden" style="box-shadow:none;background:#f8fafc"><div id="endTitle" class="hero" style="font-size:22px"></div><p>Tutte le domande hanno ricevuto un esito definitivo.</p><button id="returnHome" class="yellow">TORNA ALLA HOME</button></div></div></section></main></div>
<div id="ranking" class="modal hidden"><div class="modal-card"><div class="hero" style="font-size:23px">🏅 Classifica</div><div id="rankingRows"></div><br><button id="closeRanking" class="yellow">CHIUDI</button></div></div>
<script>(function(){'use strict';const $=id=>document.getElementById(id);const teams={alpha:'Team Alpha',bravo:'Team Bravo',charlie:'Team Charlie'};const params=new URLSearchParams(location.search);const teamKey=(params.get('team')||'').toLowerCase();if(!teams[teamKey]){$('error').textContent='QR Code non valido: team non riconosciuto.';$('error').classList.remove('hidden');$('home').classList.add('hidden');return;}const templates={1:{title:'Scopri persone e strumenti Volvo CE',questions:[{text:'Trova una persona che ha lavorato in almeno 2 sedi Volvo CE.',hint:'Inserisci Nome e Cognome.',points:20,answers:['mario rossi','rossi mario']},{text:"Trova il nome dell'applicazione utilizzata per il monitoraggio remoto delle macchine Volvo CE.",hint:"Inserisci il nome dell'applicazione.",points:15,answers:['caretrack','care track']}]},2:{title:'Conosci Volvo CE',questions:[{text:'Trova il nome del sistema utilizzato per la gestione delle relazioni con i clienti.',hint:'Inserisci il nome del sistema.',points:20,answers:['crm']},{text:'Trova il nome del prodotto Volvo CE identificato dalla sigla EC220.',hint:'Inserisci il nome o la sigla del prodotto.',points:15,answers:['ec220','volvo ec220','escavatore ec220']}]}};const storageKey='vce-xmas-v06-'+teamKey;function fresh(){const missions={};Object.keys(templates).forEach(id=>{missions[id]={title:templates[id].title,isNew:true,started:false,questions:templates[id].questions.map(q=>({...q,tries:3,passed:false,closed:false,message:''}))};});return{score:0,missions};}let state;try{state=JSON.parse(localStorage.getItem(storageKey))||fresh();}catch(e){state=fresh();}let current=null;function save(){localStorage.setItem(storageKey,JSON.stringify(state));}function norm(v){return v.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}function resolved(m){return m.questions.filter(q=>q.passed||q.closed).length}function done(m){return resolved(m)===m.questions.length}function perfect(m){return done(m)&&m.questions.every(q=>q.passed)}function status(m){if(done(m))return{t:'COMPLETATA',c:perfect(m)?'green':'red'};if(m.started)return{t:'DA COMPLETARE',c:'yellow'};return{t:'INIZIA MISSIONE',c:'yellow'};}
function refresh(){let a=0,p=0,c=0,total=0,r=0;$('teamName').textContent=teams[teamKey];$('list').innerHTML='';Object.keys(state.missions).forEach(id=>{const m=state.missions[id],s=status(m),rr=resolved(m);total+=m.questions.length;r+=rr;if(done(m))c++;else if(m.started)p++;else a++;const tile=document.createElement('div');tile.className='mission-tile';tile.innerHTML='<div class="mission-row"><span class="mission-name">Missione '+id+'</span>'+(m.isNew?'<span class="new">NEW</span>':'')+'</div><div class="mission-subtitle">'+m.title+'</div><span class="tile-progress">'+rr+' / '+m.questions.length+' domande completate</span><button class="'+s.c+'">'+s.t+'</button>';tile.querySelector('button').onclick=()=>openMission(id);$('list').appendChild(tile);});$('available').textContent=a;$('pending').textContent=p;$('completed').textContent=c;$('overall').textContent=r+' / '+total+' domande completate';$('score').textContent=state.score;}
function openMission(id){current=id;const m=state.missions[id];$('home').classList.add('hidden');$('mission').classList.remove('hidden');$('missionName').textContent='Missione '+id;$('missionTitle').textContent=m.title;$('missionNew').classList.toggle('hidden',!m.isNew);renderMission();}function renderMission(){const m=state.missions[current],r=resolved(m);$('bar').style.width=(r/m.questions.length*100)+'%';$('missionProgress').textContent=r+' di '+m.questions.length+' domande completate';$('questions').innerHTML='';m.questions.forEach((q,i)=>{const box=document.createElement('div');box.className='question';let body='<h3>Domanda '+(i+1)+'</h3><div>'+q.text+'</div><div class="meta"><div class="chip">PUNTI <strong>'+q.points+'</strong></div><div class="chip '+(q.tries===1?'last':'')+'">TENTATIVI <strong>'+q.tries+'</strong></div></div>';if(q.passed)body+='<div class="msg ok">✅ Risposta corretta</div>';else if(q.closed)body+='<div class="msg err">⛔ Domanda chiusa. Penalità: -5 punti.</div>';else body+='<input id="a'+i+'" placeholder="Risposta"><div class="small"><strong>'+q.hint+'</strong></div><button class="yellow" data-i="'+i+'">INVIA RISPOSTA</button>'+(q.message?'<div class="msg err">'+q.message+'</div>':'');box.innerHTML=body;const b=box.querySelector('button[data-i]');if(b)b.onclick=()=>submit(i);$('questions').appendChild(box);});$('missionEnd').classList.toggle('hidden',!done(m));if(done(m)){$('endTitle').textContent=perfect(m)?'✅ Missione completata':'⛔ Missione completata con penalità';$('endTitle').style.color=perfect(m)?'var(--green)':'var(--red)';}refresh();}
function submit(i){const m=state.missions[current],q=m.questions[i],input=$('a'+i),v=norm(input.value);if(!v){q.message='⚠️ Inserisci una risposta prima di inviare.';renderMission();return;}if(!m.started){m.started=true;m.isNew=false;}if(q.answers.includes(v)){q.passed=true;q.message='';state.score+=q.points;}else{q.tries--;q.message=q.tries===1?'⚠️ Risposta errata. Ti resta un solo tentativo.':'❌ Risposta errata. Puoi riprovare.';if(q.tries<=0){q.closed=true;q.message='';state.score-=5;}}save();renderMission();}
function showHome(){$('mission').classList.add('hidden');$('home').classList.remove('hidden');refresh();}function ranking(){const seeds={alpha:0,bravo:25,charlie:15};seeds[teamKey]=state.score;const rows=Object.keys(teams).map(k=>({name:teams[k],score:seeds[k]})).sort((a,b)=>b.score-a.score);$('rankingRows').innerHTML=rows.map((x,i)=>'<div class="rank"><strong>'+(i+1)+'° '+x.name+'</strong><strong>'+x.score+' punti</strong></div>').join('');$('ranking').classList.remove('hidden');}$('back').onclick=showHome;$('returnHome').onclick=showHome;$('rankingBtn').onclick=ranking;$('closeRanking').onclick=()=>$('ranking').classList.add('hidden');refresh();})();</script></body></html>
